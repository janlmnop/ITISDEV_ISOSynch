<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Login | ISO Synch</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="/styles.css">
</head>

<body class="auth-body">

<div class="auth-container">

    <div class="auth-card">

        <img src="/images/logo.png" class="auth-logo">

        <h1>ISO Synch</h1>

        <p class="auth-subtitle">
            Event Management System
        </p>

        <h2>Welcome Back</h2>

        <form id="loginForm">

            <div class="field">
                <label>Email</label>
                <input
                    type="email"
                    id="loginEmail"
                    required
                >
            </div>

            <div class="field password-field">
                <label>Password</label>
                <input
                    type="password"
                    id="loginPassword"
                    required
                >
            </div>

            <button
                type="submit"
                class="primary-btn auth-btn">
                Login
            </button>

        </form>

        <form id="twoFactorForm" style="display:none">

            <p class="auth-subtitle" style="margin-bottom:14px">
                Enter the 6-digit code from your authenticator app.
            </p>

            <div class="field">
                <label>Verification code</label>
                <input
                    type="text"
                    id="twoFactorCode"
                    inputmode="numeric"
                    maxlength="6"
                    placeholder="123456"
                    required
                >
            </div>

            <button
                type="submit"
                class="primary-btn auth-btn">
                Verify
            </button>

        </form>

        <p class="auth-link">

            Don't have an account?

            <a href="/register">
                Register
            </a>

        </p>

    </div>

</div>

<script>

let pendingTwoFactorUserId = null;

document.getElementById("loginForm").addEventListener("submit", async function(e){

    e.preventDefault();

    const email = document
        .getElementById("loginEmail")
        .value
        .trim()
        .toLowerCase();

    const password = document
        .getElementById("loginPassword")
        .value;

    try {
        const response = await fetch('/api/authenticate', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, password })
        });
        if (!response.ok) {
            alert('Invalid email or password.');
            return;
        }
        const result = await response.json();

        // 2-Factor Auth (SCRUM-25): password checked out, but this account
        // needs a verification code before we hand back the full session.
        if (result.requiresTwoFactor) {
            pendingTwoFactorUserId = result.userId;
            document.getElementById("loginForm").style.display = "none";
            document.getElementById("twoFactorForm").style.display = "";
            document.getElementById("twoFactorCode").focus();
            return;
        }

        localStorage.setItem("currentUser", JSON.stringify(result));
        window.location.href="/dashboard";
    } catch (error) {
        alert('Unable to sign in. Please try again.');
    }

});

document.getElementById("twoFactorForm").addEventListener("submit", async function(e){

    e.preventDefault();

    const token = document.getElementById("twoFactorCode").value.trim();

    try {
        const response = await fetch('/api/authenticate/2fa', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ userId: pendingTwoFactorUserId, token })
        });
        const result = await response.json();
        if (!response.ok) {
            alert(result.error === 'invalid code' ? 'Incorrect code. Please try again.' : 'Unable to verify code.');
            return;
        }
        localStorage.setItem("currentUser", JSON.stringify(result));
        window.location.href="/dashboard";
    } catch (error) {
        alert('Unable to verify code. Please try again.');
    }

});

</script>

</body>
</html>
